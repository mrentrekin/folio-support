<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed · Folio</title>
<meta name="description" content="Your Folio email address is confirmed.">
<style>
:root { --paper:#fff; --ink:#111; --secondary:#666; --rule:#dbdbdb; --accent:#7a1f2b; }
* { box-sizing:border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:2rem 1.5rem;
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-align:center;
}
.card { max-width:26rem; }
.wordmark { font-family:Didot,"Bodoni 72",Georgia,serif; font-size:2.4rem; margin:0 0 2rem; font-weight:400; }
h1 { font-family:"New York",Georgia,serif; font-size:1.7rem; font-weight:500; margin:0 0 .75rem; }
p { margin:0 0 1rem; color:var(--secondary); }
.rule { width:3rem; height:1px; background:var(--rule); margin:2rem auto; }
.small { font-size:.9rem; }
a { color:var(--ink); }
a:hover { color:var(--accent); }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0d0d0d; --ink:#f2f2f2; --secondary:#a3a3a3; --rule:#2e2e2e; --accent:#c2707c; }
}
</style>
</head>
<body>
<div class="card">
  <p class="wordmark">Folio</p>
  <h1>Your email is confirmed.</h1>
  <p>Open Folio on your phone and sign in. You can close this page.</p>
  <div class="rule"></div>
  <p class="small">Trouble signing in? Email <a href="mailto:info@mindfullcounseling.org">info@mindfullcounseling.org</a>.</p>
</div>
</body>
</html>
